# cargo-deny for desktop-skallet (Tauri). Kjøres: cargo deny --manifest-path desktop/src-tauri/Cargo.toml --config desktop/src-tauri/deny.toml check
# Egen konfig fordi rot-deny.toml er skrevet for kjernen: der er `tokio` bannlyst (K7-12: ingen async-runtime i kjernen),
# men Tauri trenger tokio. Forbudet gjelder bare `core/`; skallet ligger i eget workspace og kjernen får det aldri som avhengighet.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error (RUSTSEC-2024-0370) er uvedlikeholdt, ikke en sårbarhet. Kommer bare via glib-macros -> gtk-rs 0.18
    # (gtk/webkit2gtk), som Tauri 2 bruker på Linux. Går ikke inn i Windows-bygget (MVP-plattformen). Ingen trygg oppgradering finnes
    # før Tauri går over til gtk4-rs. Fjernes når Tauri oppdaterer; sjekk ved hver Tauri-oppgradering.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained, proc-macro (byggetid), kun via gtk-rs 0.18 på Linux; ikke i Windows-bygget" },
]

[licenses]
version = 2
# Samme tillatelsesliste som kjernen (deny.toml i rota), verifisert mot skallets avhengighetstre 2026-11-12.
# Ingen ekstra lisenser er åpnet for Tauri; `cargo deny check licenses` måtte bestå uten tillegg.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# Tauri drar inn mange dobbeltversjoner (gtk-rs, phf, syn 1/2, toml): bare varsel, ikke feil.
multiple-versions = "warn"
wildcards = "deny"
# tokio er bevisst tillatt her (Tauri-runtime). Ingen ban-liste i skallet.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
