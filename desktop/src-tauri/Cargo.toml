# Eget Cargo-workspace for desktop-skallet (ARKITEKTUR beslutning 11, 17, 21).
# Ligger bevisst UTENFOR core/-workspacet: `just check` skal ikke kreve webkit2gtk/WebView2.
# `shell` (ren Rust, testbar overalt) holder kommandologikken; roten her er bare Tauri-limet.
[workspace]
resolver = "2"
members = [".", "shell"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "fjell-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "fjell_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
fjell-shell = { path = "shell" }
tauri-plugin-process = "2"
# tauri::generate_context! bygger plugin-konfigurasjonen (plugins.updater) med serde_json og krever den som direkte avhengighet.
serde_json = "1"

# Oppdatering (beta-kanalen) er bare for skrivebord; mobil kommer etter MVP.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
