# Utgivelse (docs/RELEASE-PROSESS.md): tag vX.Y.Z (eller manuell kjøring) bygger NSIS-pakken på windows-latest,
# røyktester den, signerer den hvis signeringshemmeligheter finnes, og lager en GitHub Release som UTKAST
# med endringslogg og SHA-256. Ingenting publiseres automatisk; produkteier trykker «Publish».
# Usignert bygg er lov (lukket beta): signeringsjobben hoppes over når hemmeligheter mangler.
# Ingen hemmeligheter ligger i filen; navnene er dokumentert i docs/RELEASE-PROSESS.md.
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versjon uten v (f.eks. 0.1.0 eller 0.1.0-beta.1). Må stemme med tauri.conf.json."
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  # Avgjør versjon og om signering er mulig. Hemmeligheter kan ikke brukes direkte i `if:`,
  # derfor leses de inn som miljøvariabler her og bare «finnes/finnes ikke» sendes videre.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      can_sign: ${{ steps.sign.outputs.can_sign }}
    steps:
      - uses: actions/checkout@v4
      - name: Versjon og versjonskontroll
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Ugyldig versjon: $version (forventet SemVer)"; exit 1
          fi
          core="${version%%-*}"
          # NSIS krever numerisk produktversjon: kjerneversjonen må stå i alle tre filer (RELEASE.md del 5).
          conf=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json;print(json.load(open('desktop/package.json'))['version'])")
          crate=$(grep -m1 '^version' desktop/src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          for pair in "tauri.conf.json=$conf" "package.json=$pkg" "Cargo.toml=$crate"; do
            if [ "${pair#*=}" != "$core" ]; then
              echo "::error::${pair%%=*} har versjon ${pair#*=}, forventet $core. Bump alle tre før tagging."; exit 1
            fi
          done
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          { echo "version=$version"; echo "tag=v$version"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"
      - name: Finnes signeringshemmeligheter?
        id: sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TS_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] \
             && [ -n "$TS_ENDPOINT" ] && [ -n "$TS_ACCOUNT" ] && [ -n "$TS_PROFILE" ]; then
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signeringshemmeligheter mangler: bygget blir USIGNERT (SmartScreen-advarsel)."
          fi

  # Samme bygg- og røyktestsstegene som desktop.yml (kopiert bevisst; desktop.yml er ikke gjenbrukbar via workflow_call).
  # Full test (clippy, Playwright) kjøres av desktop.yml på main; her kjøres bare det som trengs for en pakke.
  build:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust-verktøy
        run: rustup component add rustfmt clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            desktop/src-tauri
      - name: Test fjell-fs og skall
        run: |
          cargo test --manifest-path core/Cargo.toml -p fjell-fs -p fjell-cli --locked
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --workspace --locked
      - name: Frontend (kontrast, vitest, svelte-check)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run contrast
          npm test
          npm run check
      - name: Bygg Tauri-appen (NSIS)
        working-directory: desktop
        run: npx tauri build --bundles nsis
      - name: Røyktest NSIS-installasjonsprogram
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "fant ikke NSIS-installasjonsprogram" }
          $dir = Join-Path $env:RUNNER_TEMP "fjell-smoke"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait
          $exe = Get-ChildItem $dir -Filter *.exe -Recurse | Where-Object { $_.Name -notmatch "^uninstall" } | Select-Object -First 1
          if (-not $exe) { throw "ingen app-exe etter installasjon i $dir" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "appen avsluttet av seg selv, kode $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          $un = Join-Path $dir "uninstall.exe"
          Start-Process -FilePath $un -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe.FullName) { throw "appen ligger igjen etter avinstallasjon" }
      - uses: actions/upload-artifact@v4
        with:
          name: fjell-nsis-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # Hoppes over (uten feil) når hemmeligheter mangler. Signerer installasjonsprogrammet med tidsstempel.
  # NB: dette signerer bare setup.exe, ikke fjell.exe inni; se RELEASE-PROSESS.md «Begrensning».
  sign:
    needs: [prepare, build]
    if: needs.prepare.outputs.can_sign == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fjell-nsis-unsigned
          path: installer
      - name: Signer med Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Kontroller signatur
        shell: pwsh
        run: |
          Get-ChildItem installer/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            if ($s.Status -ne "Valid") { throw "ugyldig signatur på $($_.Name): $($s.Status)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: fjell-nsis-signed
          path: installer/*-setup.exe
          if-no-files-found: error

  # Alltid UTKAST. Kjører også når sign er hoppet over.
  release:
    needs: [prepare, build, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      SIGNED: ${{ needs.sign.result == 'success' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign.result == 'success' && 'fjell-nsis-signed' || 'fjell-nsis-unsigned' }}
          path: dist
      - name: Endringslogg, sjekksum og utgivelsesnotat
        run: |
          set -euo pipefail
          cd dist
          for f in *-setup.exe; do sha256sum "$f" > "$f.sha256"; done
          cd ..
          # Utdrag fra CHANGELOG.md: seksjonen for versjonen, ellers [Ikke utgitt].
          extract() { awk -v h="## [$1]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md; }
          log=$(extract "$VERSION")
          if [ -z "$log" ]; then
            echo "::warning::CHANGELOG.md mangler seksjon [$VERSION]; bruker [Ikke utgitt]."
            log=$(extract "Ikke utgitt")
          fi
          {
            if [ "$SIGNED" = "true" ]; then
              echo "Installasjonsprogrammet er signert (Azure Trusted Signing)."
            else
              echo "> **Usignert bygg (lukket beta).** Windows SmartScreen viser trolig «Windows beskyttet PC-en din». Velg «Mer info», deretter «Kjør likevel», og bare hvis du har fått filen direkte fra oss og sjekksummen under stemmer."
            fi
            echo
            echo "## Endringer"
            echo
            printf '%s\n' "$log"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
            echo
            echo "Kontroll i PowerShell: \`Get-FileHash .\\<fil>-setup.exe -Algorithm SHA256\`"
            echo
            echo "## Kjente begrensninger"
            echo
            echo "- HEIC/RAW krever Windows-kodek. Nettverksstasjoner kan gi «Merket, ikke flyttet»."
            echo "- Ingen automatisk oppdatering: installer ny versjon over den gamle (data beholdes)."
          } > notes.md
      - name: Lag utkast til GitHub Release
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--draft --title "Fjell $VERSION" --notes-file notes.md --target "$TARGET_SHA")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          # Finnes utkastet fra før (omkjøring), erstattes filene.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${args[@]}" dist/*
          fi
