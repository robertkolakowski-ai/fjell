# Jobb `i18n`: paritet nb/en, ICU-delmengde, utdatert generert kode, pseudo-lokale og lint mot
# hardkodet tekst i desktop/src (docs/mvp/PLAN-UX-I18N.md 5.5). Kjører `just i18n`.
name: i18n
on:
  push:
    branches: [main]
    paths: &paths ["i18n/**", "desktop/src/**", "core/crates/fjell-core/src/model/plan.rs", "tools/gen-i18n/**", "justfile", ".github/workflows/i18n.yml"]
  pull_request:
    paths: *paths
permissions:
  contents: read
jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just i18n
