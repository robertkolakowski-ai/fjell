# cargo-deny (kjøres fra core/: `cargo deny --manifest-path core/Cargo.toml check`)
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml er "unmaintained" (ikke en sårbarhet) og kommer bare via uniffi_bindgen, et byggeverktøy for Swift-bindinger som ikke brukes i PC-MVP. Fjernes når uniffi flyttes ut eller oppdateres.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained, kun byggetid via uniffi_bindgen" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # uniffi (fjell-ffi) er MPL-2.0: filnivå copyleft, kun avhengighet (ingen endring av uniffi-filer)
    "MPL-2.0",
]
confidence-threshold = 0.9

# Egne crates er publish = false og har ingen lisensfelt ennå
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# K7-12: ingen async-runtime i kjernen.
deny = [{ name = "tokio" }]
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
